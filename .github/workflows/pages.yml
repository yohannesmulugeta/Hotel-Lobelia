name: Deploy Next.js Hotel Lobelia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static Next.js site
        run: npm run build

      - name: Upload static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Publish static build to repository root
        run: |
          rm -rf index.html index.txt 404.html 404 _next _not-found sequence __next*
          cp -a out/. .
          touch .nojekyll
          rm -rf out

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f index.html index.txt 404.html 404 _next _not-found .nojekyll sequence __next*
          if git diff --cached --quiet; then
            echo "No static-site changes to commit."
          else
            git commit -m "Publish static site [skip actions]"
            git push origin HEAD:main
          fi

  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
